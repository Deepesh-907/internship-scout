name: internship-scout

on:
  schedule:
    # Public repo: Actions minutes are unlimited, so the cadence is only bounded by
    # run length. Hydration takes ~3-4 min and the concurrency group queues rather
    # than cancels, so */10 is the tightest interval that cannot overlap itself.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan + deliver alerts
        run: python scout.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # the resume itself — kept out of the public repo
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}

      - name: Persist seen-state
        run: |
          git config user.name "scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json state/source_errors.json
          git diff --cached --quiet || (git commit -m "state update [skip ci]" && git push)
