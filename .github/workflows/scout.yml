name: internship-scout

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (UTC); GitHub may add a few minutes' delay
  workflow_dispatch: {}       # manual "Run workflow" button

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan + deliver alerts
        run: python scout.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Persist seen-state
        run: |
          git config user.name "scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json state/source_errors.json
          git diff --cached --quiet || (git commit -m "state update [skip ci]" && git push)
